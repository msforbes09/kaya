# PORT, HTTP_PORT and HTTPS_PORT come from .env (defaults 8787, 80, 443).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8787}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["${PORT:-8787}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-8787}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # TLS and the public entry point. Skip it (docker compose up -d app, plus
  # docker-compose.expose.yml) when the host already runs a reverse proxy.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      APP_PORT: ${PORT:-8787}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
